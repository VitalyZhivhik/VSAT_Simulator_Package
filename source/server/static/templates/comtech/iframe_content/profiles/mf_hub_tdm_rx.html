<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" type="text/css" href="/static/css/ls.css">
    <title>CEL-AC - TDM RX</title>
</head>
<body>
<center>
<h3>Profile 2 (MF hub)</h3>
<a href="/sim/profiles/mf_hub/basic" class="nav-link">Basic</a> | 
<a href="/sim/profiles/mf_hub/tdm_rx" class="nav-link">TDM/SCPC RX</a> | 
<a href="/sim/profiles/mf_hub/tdm_tx" class="nav-link">TDM/SCPC TX</a> | 
<a href="/sim/profiles/mf_hub/modulator" class="nav-link">Modulator</a> | 
<a href="/sim/profiles/mf_hub/timing" class="nav-link">Timing</a> | 
<a href="/sim/profiles/mf_hub/tlc" class="nav-link">TLC</a> | 
<a href="/sim/profiles/mf_hub/tdm_acm" class="nav-link">TDM ACM</a> 
<br>
<a href="/sim/profiles/mf_hub/tdma_rf" class="nav-link">TDMA RF</a> | 
<a href="/sim/profiles/mf_hub/tdma_prot" class="nav-link">TDMA prot</a> | 
<a href="/sim/profiles/mf_hub/tdma_bw" class="nav-link">TDMA BW</a> | 
<a href="/sim/profiles/mf_hub/tdma_acm" class="nav-link">TDMA ACM</a> | 
<a href="/sim/profiles/mf_hub/roaming" class="nav-link">Roaming</a> 

<h3>TDM RX</h3>
<form method="get" action="/sim/api/profiles/mf_hub/tdm_rx">
    <table>
        <tbody>
            <tr>
                <td>Input gain</td>
                <td>
                    <select name="do">
                        <option value="0" selected>Low</option>
                        <option value="1">High</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th colspan="2">Demodulator 1</th>
            </tr>
            <tr>
                <input name="df" type="hidden" value="1">
            </tr>
            <tr>
                <td>Input select</td>
                <td>
                    <select name="dj">
                        <option value="0" selected>RX-1</option>
                        <option value="1">RX-2</option>
                    </select>
                </td>
            </tr>
            <tr>
                <input name="da" type="hidden" value="2">
                <td>Frequency (kHz) 950000-32000000</td>
                <td><input name="db" type="text" size="8" maxlen="8" value="950000"></td>
            </tr>
            <tr>
                <td>SymRate (kSps) 300-200000</td>
                <td><input name="dc" type="text" size="5" maxlen="5" value="1000"></td>
            </tr>
            <tr>
                <td>Slice (0-250)</td>
                <td><input name="dm" type="text" size="3" maxlen="3" value="0"></td>
            </tr>
            <tr>
                <td colspan="2" style="border:none;height:1em"></td>
            </tr>
            <tr>
                <th colspan="2">LNB voltage</th>
            </tr>
            <tr>
                <td colspan="2">
                    <input name="dl" type="radio" value="1">13V 
                    <input name="dl" type="radio" value="0" checked>18V
                </td>
            </tr>
        </tbody>
    </table>
    <br>
    <input type="submit" name="tf" value="Apply">
    <div align="left"><a href="/sim/cc3">Back</a></div>
</form>
</center>
</body>
</html>
